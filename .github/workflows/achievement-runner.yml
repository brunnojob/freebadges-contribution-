name: Freebadges executor
run-name: Freebadges ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Request ID from the Pages dashboard
        required: true
        type: string
      plan:
        description: JSON execution plan (never include tokens)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: freebadges-${{ github.actor }}
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute the account owner's plan
        env:
          FREEBADGES_RUNNER: '1'
          PLAN_JSON: ${{ inputs.plan }}
          CLASSIC_PAT: ${{ secrets.CLASSIC_PAT }}
          COAUTHOR_PAT: ${{ secrets.COAUTHOR_PAT }}
        run: node scripts/actions-runner.mjs
      - name: Save operation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-report
          path: execution-report.json
          if-no-files-found: warn
          retention-days: 7
