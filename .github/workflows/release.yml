name: Publish v3.0.1 release
on:
  push:
    branches: [main]
    paths: [docs/launch/release-v3.0.1.md]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'brunnojob/freebadges-contribution-'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const tag = 'v3.0.1';
            try {
              const existing = await github.rest.repos.getReleaseByTag({...context.repo, tag});
              core.notice(`Release already exists: ${existing.data.html_url}`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const release = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'Freebadges Contribution v3.0.1 — Pages + Actions',
              body: fs.readFileSync('docs/launch/release-v3.0.1.md', 'utf8'),
              draft: false,
              prerelease: false,
              make_latest: 'true'
            });
            core.notice(`Published ${release.data.html_url}`);
