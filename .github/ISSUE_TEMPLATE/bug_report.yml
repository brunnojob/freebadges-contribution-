name: Bug report
description: Report a reproducible UI or workflow defect.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Never include tokens, secrets or private repository content. Use dummy account names in examples.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the app step and execution engine (browser or Actions).
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system and interface language
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized error message or screenshot
      description: Remove all credentials and private account details before attaching anything.
